<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exercicío 1 - Tabela</title>
	</head>
	<body>
		<!-- table -> tabela-->
		<!-- Iniciciando a tabela -->
		<table border="1" width="100%">
			<!-- thead -> table head -> cabeçalho da tabela -->
			<thead style="background-color: #28B263; color: black">
			<!-- Criando a primeira linha -->
			<!-- linha da tabela -> table row -> tr -->
				<tr>
					<!-- th -> table head -> cabeçalho -->
					<th colspan="5">Tabela de Serviços Mecânicos</th>
				</tr>
			<thead>
			<!-- tbody -> table body -> corpo da tabela -->
			<tbody>
				<!-- Criando a segunda linha -->
				<!-- Linha da tabela -> table row -> tr -->
				<tr>
				<!-- td -> table data -> dados da tabela -->
					<td rowspan="6" style="background-color: #484d50; text-align: center">Nacionais</td>
					<td style="background-color: #CBCBCB; text-align: center">Veículos</td>
					<td style="background-color: #CBCBCB; text-align: center">Serviço</td>
					<td style="background-color: #CBCBCB; text-align: center">Tempo Previsto</td>
					<td style="background-color: #CBCBCB; text-align: center">Valor</td>
				</tr>
				<!-- Criando a terceira linha -->
				<!-- Linha da tabela -> table row -> tr -->
				<tr>
					<td>Caminhonete S10</td>
					<td>Suspensão</td>
					<td>3 horas e 25 minutos</td>
					<td>350,00</td>
				</tr>
				
				<tr>
					<td>Caminhonete Ranger</td>
					<td>Freio</td>
					<td>3 horas e 45 minutos</td>
					<td>200,00</td>
				</tr>
				
				<tr>
					<td>Caminhonete Hilux</td>
					<td>Troca de Bateria</td>
					<td>30 minutos</td>
					<td>25,00</td>
				</tr>
				
				<tr>
					<td>Caminhonete D10</td>
					<td>Alinhamento</td>
					<td>1 hora e 40 minutos</td>
					<td>220,00</td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
