<!DOCTYPE html>
<html lang="pt-br">
<head> <!-- É um contêiner para metadados -->
	<meta charset="UTF-8">
	<title>Exemplo</title>
</head>
<body><!-- Define o corpo do documento -->
	<header> <!-- Cabeçalho -->
		<h1>Título da Página</h1> <!-- Título -->
		<nav> <!-- Criar uma seção à página -->
			<p>Home</p> <!-- Parágrafo -->
		</nav>
	</header>
	<main><!-- Definir o conteúdo principal -->
		<article><!-- Definir conteúdo independente e autossuficiente -->
		<h2>Artigo 1</h2><!-- Segundo Título -->
		<p>Este é um artigo sobre...</p><!-- Parágrafo -->
		</article>
		<article>
			<h2>Artigo 2</h2>
			<p>Este é outro artigo sobre...</p>
			</article>
		</main>
		<footer><!-- Define um rodapé para um documento ou seção -->
			<p>&copy; 2024 Exemplo</p>
		</footer>
</body>
</html>
